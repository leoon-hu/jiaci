services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiword
      POSTGRES_USER: aiword
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set_POSTGRES_PASSWORD_in_dot_env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aiword_postgres:/var/lib/postgresql/data
volumes:
  aiword_postgres:
